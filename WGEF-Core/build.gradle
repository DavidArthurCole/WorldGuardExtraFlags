plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
    id 'fr.il_totore.manadrop' version '0.4.3'
    id "net.kyori.indra.git" version "3.1.3"
}

group 'io.github.invvk'
version "$parent.version"

repositories {
    mavenCentral()
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    compileOnly 'net.essentialsx:EssentialsX:2.20.1'
    compileOnly 'me.clip:placeholderapi:2.11.6'

    implementation "org.bstats:bstats-bukkit:3.1.0"
    implementation project(":WGEF-Abstraction")
    implementation project(":WG7")
}

shadowJar {
    archiveBaseName.set('WGEF-REBORN')
    archiveClassifier.set('')
    archiveVersion.set('')

    //PUT THE PATH TO YOUR BUILD DIRECTORY HERE - ex:
    // destinationDirectory = file("C:\\Users\\david\\Desktop\\Server\\plugins")
    destinationDirectory = file("C:\\Users\\david\\Desktop\\plugins")

    exclude 'META-INF/**'
    exclude 'LICENSE'

    relocate 'org.bstats', 'io.github.davidarthurcole.wgef.metrics'

    finalizedBy('clean', ':WG7:clean', ':WGEF-Abstraction:clean')
}

spigot {
    desc {
        main 'io.github.davidarthurcole.wgef.WGEFPlugin'
        named 'WGEF-Reborn'
        authors 'oBlazin', 'DavidArthurCole'
        apiVersion '1.21.3'
        version "${parent.version}+${indraGit.commit().abbreviate(7).name()}"
        depend('WorldGuard')
        softDepend('FastAsyncWorldEdit', 'Essentials', 'TAB')
        description 'Adds more flags to WorldGuard to help manage your server easily!'
    }
}

processResources.finalizedBy(spigotPlugin)