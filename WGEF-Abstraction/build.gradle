plugins {
    id 'java'
}

group 'io.github.davidarthurcole'
version "$parent.version"

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
    maven {
        name "essentialsxSnapshots"
        url "https://repo.essentialsx.net/snapshots"
    }
}

dependencies {
    compileOnly 'net.essentialsx:EssentialsX:2.21.0-SNAPSHOT'
    compileOnly 'com.github.NEZNAMY:TAB-API:5.0.7'
}