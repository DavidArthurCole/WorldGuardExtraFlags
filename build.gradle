buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java'
}

group 'io.github.davidarthurcole'
version '2.10'

repositories {
    mavenCentral()
}

subprojects {
    apply plugin: 'java'

    compileJava.options.encoding = "UTF-8"

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(22))
        }
    }

    repositories {
        mavenCentral()
        google()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
        maven { url "https://maven.enginehub.org/repo/" }
        maven { url "https://repo.dmulloy2.net/repository/public/" }
        maven {
            name "spigot-repo"
            url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
        }
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        compileOnly('org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT')
        compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.13-SNAPSHOT'

        compileOnly("com.sk89q.worldedit:worldedit-core:7.3.9")
        compileOnly("com.sk89q.worldedit:worldedit-bukkit:7.3.9") { transitive = false }
    }

    configurations.configureEach {
        resolutionStrategy {
            force 'com.google.guava:guava:33.3.1-jre'
            force 'com.google.code.gson:gson:2.11.0'
            force 'org.apache.logging.log4j:log4j-bom:2.24.1'
        }
    }
}
